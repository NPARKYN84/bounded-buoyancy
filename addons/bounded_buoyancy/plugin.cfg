[plugin]

name="Bounded Buoyancy"
description="Stable, accurate buoyancy for RigidBody3D: the added mass of the submerged part goes into the inertia, so light bodies no longer launch out of the water; buoyancy acts at the centre of the immersed volume, so bodies of any shape tilt and right themselves, and settle as their bobbing sends out ripples; water nodes with waves can be placed anywhere in a scene, or take their surface from another water system such as an ocean shader; currents, wind and splashes; boats with keels, rudders, sails and propellers; compartments that flood through holes, so ships list and sink; cannons, whose round shot flies with a cannonball's drag and skips off the water at shallow angles; a 2D version; and an optional native kernel keeps hundreds of bodies fast."
author="Nicholas Parkyn"
version="2.4.0"
script="plugin.gd"
