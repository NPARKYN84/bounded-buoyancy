[plugin]

name="Bounded Buoyancy"
description="Stable, accurate buoyancy for RigidBody3D: the added mass of the submerged part goes into the inertia, so light bodies no longer launch out of the water; buoyancy acts at the centre of the immersed volume, so bodies of any shape tilt and right themselves; water nodes with waves can be placed anywhere in a scene, or take their surface from another water system such as an ocean shader; currents, wind, sails and splashes; a 2D version; and an optional native kernel keeps hundreds of bodies fast."
author="Nicholas Parkyn"
version="2.1.1"
script="plugin.gd"
