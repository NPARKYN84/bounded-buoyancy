[plugin]

name="Bounded Buoyancy"
description="Floating done properly, in one node: put BoundedBuoyancyBody on a RigidBody3D, set a density, and it floats at the right depth, tilts and rights itself, rides the waves and never shoots out of the water (the added mass of the submerged part goes into the inertia). Then, as you want them: your own water nodes with waves, currents and splashes, or the surface of the ocean shader you already use; real water and air whose density follows temperature, salt and depth, with oil, brine and mud layers; boats with keels, rudders, sails and propellers; compartments that flood through holes so ships list and sink; cannons whose round shot skips and holes planking; fishing lines, floats and fish that bite and fight; a 2D version; and an optional native kernel for hundreds of bodies."
author="Nicholas Parkyn"
version="2.6.2"
script="plugin.gd"
