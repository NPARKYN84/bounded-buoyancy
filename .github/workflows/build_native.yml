# Runs the plugin's checks headless, and builds the optional native kernel for Windows, Linux and
# macOS whenever its source changes, keeping the libraries as downloadable artifacts of the run.
name: Checks and native kernel
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
      - name: Import the project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --import --path . || true
      - name: Run the checks (native kernel)
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --fixed-fps 60 --path . --script res://tests/run_tests.gd
      - name: Run the checks (GDScript only)
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --fixed-fps 60 --path . --script res://tests/run_tests.gd -- --gdscript

  native:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ' '), 'native/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, arch: x86_64 }
          - { os: windows-latest, platform: windows, arch: x86_64 }
          - { os: macos-latest, platform: macos, arch: universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SCons
        run: python -m pip install scons==4.8.1
      - name: Fetch godot-cpp
        working-directory: native
        run: git clone --depth 1 --branch godot-4.4-stable https://github.com/godotengine/godot-cpp.git
      - name: Build
        working-directory: native
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release -j4
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: addons/bounded_buoyancy_native/bin/*${{ matrix.platform }}*
