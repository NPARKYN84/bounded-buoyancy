name: Unity package checks

on:
  push:
    paths: ["unity/**", ".github/workflows/unity_checks.yml"]
  pull_request:
    paths: ["unity/**"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Physics core against the benchmarks
        run: dotnet run -c Release --project unity/checks/CoreTests/CoreTests.csproj
      - name: Edit-mode tests in plain .NET
        run: dotnet run -c Release --project unity/checks/EditModeRunner/EditModeRunner.csproj
      - name: Compile against the Unity 2022.3 and Unity 6 API, assembly by assembly
        working-directory: unity/checks/Split
        run: |
          for v in 2022_3 6000_0; do
            python3 make.py $v
            for p in SamplesEditor Tests EditorTests; do
              dotnet build -warnaserror "$v/$p/$p.csproj"
            done
          done
